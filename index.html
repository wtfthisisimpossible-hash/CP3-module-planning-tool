function loadProject(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.modules || !Array.isArray(data.modules)) throw new Error('格式錯誤');

      // 清除畫布
      modules.forEach(mod => {
        const div = document.getElementById(`mod-${mod.uid}`);
        if (div) div.remove();
      });
      modules = [];
      selectedUid = null;
      selectedUids.clear();

      // 載入模塊
      const validIds = new Set(Object.values(PRODUCT_MODELS).flat().map(m => m.id));
      const modelMap = {};
      Object.values(PRODUCT_MODELS).flat().forEach(m => { modelMap[m.id] = m; });
      data.modules.forEach(mod => {
        // 確保必要欄位，且型號在已知清單內
        if (!mod.uid || !mod.id || !validIds.has(mod.id)) return;
        mod.note = mod.note || '';
        mod.rotate = mod.rotate || 0;
        mod.acrylicQty = 0;
        // 還原訂製高度相關欄位
        const template = modelMap[mod.id];
        if (template && template.heightCustomizable) {
          mod.heightCustomizable = true;
          mod.customHeight = mod.customHeight || mod.height || template.height;
          mod.height = mod.customHeight;
        } else {
          mod.heightCustomizable = false;
        }
        // 還原側收邊狀態（舊檔無此欄位時預設 true）
        if (mod.id === 'P3N-LSIDE' || mod.id === 'P3N-RSIDE') {
          if (mod.useEdge === undefined) mod.useEdge = true;
        }
        // 還原面板高度陣列（P3N-BPANEL 專用）
        if (mod.id === 'P3N-BPANEL') {
          if (Array.isArray(mod.panelHeights) && mod.panelHeights.length >= 1) {
            // 兼容舊格式（純數字）及新格式（物件）
            mod.panelHeights = mod.panelHeights.map((p, _i, _arr) => {
              if (typeof p === 'object' && p !== null) {
                const h = Math.max(50, Math.round(p.h));
                const _isLast = _i === _arr.length - 1;
                const _deduct = _isLast ? 41 : 15;
                const _rawH   = h + _deduct;
                let mat = p.material || '平面烤漆';
                // 高度 > 400mm 時玻璃材質自動還原
                if (PANEL_MATERIAL_GLASS[mat] && _rawH > 400) mat = '平面烤漆';
                const glassFixed = PANEL_MATERIAL_GLASS[mat];
                const color   = glassFixed ? glassFixed.hex   : (p.color || '#ffffff');
                const opacity = glassFixed ? glassFixed.opacity : (p.opacity != null ? p.opacity : 1);
                return { h, color, opacity, material: mat };
              }
              return { h: Math.max(50, Math.round(p)), color: '#ffffff', opacity: 1, material: '平面烤漆' };
            });
          } else if (typeof mod.panelCount === 'number' && mod.panelCount >= 1) {
            mod.panelHeights = Array.from({ length: mod.panelCount },
              (_, i) => ({ h: i === mod.panelCount - 1 ? 750 - 41 : 200 - 15, color: '#ffffff', opacity: 1, material: '平面烤漆' }));
          } else {
            mod.panelHeights = [{ h: 750 - 41, color: '#ffffff', opacity: 1, material: '平面烤漆' }];
          }
          delete mod.panelCount;
          // 重算 mod.height（DOM 尚未建立，僅算值，不操作 DOM）
          const _svgPerMm  = 201.5 / 750;
          const _fixedSVG  = 3.33 + mod.panelHeights.length * 4.26 + 2.83 + 0.5;
          const _whiteMM   = mod.panelHeights.reduce((s, p) => s + p.h, 0);
          mod.height = Math.round(_fixedSVG / _svgPerMm + _whiteMM);
        }
        modules.push(mod);
        renderModuleDOM(mod);
      });

      renderTable();
      updateEmptyHint();
      showToast(`已載入 ${modules.length} 個模塊`);
    } catch (err) {
      showToast('載入失敗：檔案格式不正確');
    }
  };
  reader.readAsText(file);

  // 重置 input，讓同一檔案可再次觸發 onchange
  event.target.value = '';
}

// ==========================================
// 7. 精確不失真：原生 2D Canvas 配置擷圖邏輯
// ==========================================
function captureCanvas() {
  if (modules.length === 0) {
    showToast("畫布空白，無法截圖");
    return;
  }

  showToast("正在生成高解析度平面圖...");

  const PADDING = 200; // 向外擴展 200 邏輯像素
  const DPR = 2;       // 2 倍解析度輸出

  // 1. 計算所有模塊旋轉後的實際邊界框
  //    對每個模塊取 4 個角點做旋轉，求整體最大外框
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

  modules.forEach(mod => {
    const wPx = mod.width * SCALE;
    const hPx = mod.height * SCALE;
    const cx = mod.x + wPx / 2;
    const cy = mod.y + hPx / 2;

    // 4 個角點（相對中心）
    const _angle = ((mod.rotate || 0) * Math.PI) / 180;
    const _cos = Math.cos(_angle);
    const _sin = Math.sin(_angle);
    [[-wPx/2, -hPx/2], [wPx/2, -hPx/2], [wPx/2, hPx/2], [-wPx/2, hPx/2]].forEach(([lx, ly]) => {
      const wx = cx + lx * _cos - ly * _sin;
      const wy = cy + lx * _sin + ly * _cos;
      if (wx < minX) minX = wx;
      if (wx > maxX) maxX = wx;
      if (wy < minY) minY = wy;
      if (wy > maxY) maxY = wy;
    });
  });

  // 2. 加上 padding，得到擷圖範圍（邏輯像素）
  const cropX = minX - PADDING;
  const cropY = minY - PADDING;
  const cropW = (maxX - minX) + PADDING * 2;
  const cropH = (maxY - minY) + PADDING * 2;

  // 3. 建立高解析度 Canvas
  const exportCanvas = document.createElement('canvas');
  exportCanvas.width  = Math.ceil(cropW * DPR);
  exportCanvas.height = Math.ceil(cropH * DPR);
  const ctx = exportCanvas.getContext('2d');
  ctx.scale(DPR, DPR);

  // 4. 填滿背景色
  ctx.fillStyle = '#fcfcfc';
  ctx.fillRect(0, 0, cropW, cropH);

  // 5. 繪製網格（對齊世界座標網格，平移至擷圖原點）
  const step1000 = 100;
  const step200  = 20;

  // 計算網格起始點（對齊世界座標的 20px 格線）
  const gridStartX = Math.floor(cropX / step200) * step200;
  const gridStartY = Math.floor(cropY / step200) * step200;

  ctx.fillStyle = '#ccc';
  for (let wx = gridStartX; wx <= cropX + cropW; wx += step200) {
    for (let wy = gridStartY; wy <= cropY + cropH; wy += step200) {
      ctx.beginPath();
      ctx.arc(wx - cropX, wy - cropY, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const gridStart1000X = Math.floor(cropX / step1000) * step1000;
  const gridStart1000Y = Math.floor(cropY / step1000) * step1000;

  ctx.fillStyle = '#5d5d5d';
  for (let wx = gridStart1000X; wx <= cropX + cropW; wx += step1000) {
    for (let wy = gridStart1000Y; wy <= cropY + cropH; wy += step1000) {
      ctx.beginPath();
      ctx.arc(wx - cropX, wy - cropY, 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 6. 依序繪製所有模塊（座標平移至擷圖原點）
  let loadedImagesCount = 0;

  modules.forEach(mod => {
    const img = new Image();
    const _capSvgId = ((mod.acrylicQty || 0) > 0 && CUSTOM_SVG[mod.id + 'S']) ? (mod.id + 'S') : mod.id;
    const _rawCapSvg = (mod.id === 'P3N-BPANEL') ? getEffectiveModuleSVG(mod)
      : mod.heightCustomizable ? getEffectiveModuleSVG(mod) : (CUSTOM_SVG[_capSvgId] || "");
    const _blob = new Blob([_rawCapSvg], {type:"image/svg+xml"});
    img.src = URL.createObjectURL(_blob);

    img.onload = () => {
      ctx.save();

      const wPx = mod.width * SCALE;
      const hPx = mod.height * SCALE;
      // 模塊中心點平移至擷圖座標系
      const centerX = (mod.x + wPx / 2) - cropX;
      const centerY = (mod.y + hPx / 2) - cropY;

      ctx.translate(centerX, centerY);
      ctx.drawImage(img, -wPx / 2, -hPx / 2, wPx, hPx);

      ctx.restore();

      loadedImagesCount++;
      if (loadedImagesCount === modules.length) {
        finalizeDownload();
      }
    };

    img.onerror = () => {
      loadedImagesCount++;
      if (loadedImagesCount === modules.length) {
        finalizeDownload();
      }
    };
  });

  function finalizeDownload() {
    exportCanvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = `CP3_Screen_Design_${Date.now()}.png`;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 10000);
      showToast("平面圖下載完成");
    }, 'image/png');
  }
}
// ==========================================
// 複製選取模塊（Ctrl+D）
// ==========================================
function duplicateSelected() {
  // 收集目前選取的所有模塊（單選 + 多選）
  const targetUids = new Set();
  if (selectedUid !== null) targetUids.add(selectedUid);
  selectedUids.forEach(uid => targetUids.add(uid));

  if (targetUids.size === 0) {
    showToast('請先選取要複製的模塊');
    return;
  }

  const targets = [...targetUids].map(uid => modules.find(m => m.uid === uid)).filter(Boolean);

  // gid 群組：若只選到部分成員，自動補齊整組
  const extraGids = new Set(targets.filter(m => m.gid).map(m => m.gid));
  extraGids.forEach(gid => {
    modules.filter(m => m.gid === gid && !targetUids.has(m.uid)).forEach(m => {
      targetUids.add(m.uid);
      targets.push(m);
    });
  });

  // 計算被選取群組的 bounding box
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  targets.forEach(mod => {
    const wPx = mod.width * SCALE;
    const hPx = mod.height * SCALE;
    if (mod.x < minX) minX = mod.x;
    if (mod.y < minY) minY = mod.y;
    if (mod.x + wPx > maxX) maxX = mod.x + wPx;
    if (mod.y + hPx > maxY) maxY = mod.y + hPx;
  });

  // 群組 bounding box（邏輯像素）
  const groupW = maxX - minX;
  const groupH = maxY - minY;

  // 以整個群組 bbox 為單位，螺旋掃描找空白錨點（bbox 左上角）
  function findGroupAnchor(gW, gH) {
    // 用現有所有模塊（含被選取的原模塊）的整體 bbox 做外框
    let allMinX = Infinity, allMinY = Infinity, allMaxX = -Infinity, allMaxY = -Infinity;
    modules.forEach(m => {
      const mw = m.width * SCALE, mh = m.height * SCALE;
      allMinX = Math.min(allMinX, m.x); allMinY = Math.min(allMinY, m.y);
      allMaxX = Math.max(allMaxX, m.x + mw); allMaxY = Math.max(allMaxY, m.y + mh);
    });
    const allCX = (allMinX + allMaxX) / 2;
    const allCY = (allMinY + allMaxY) / 2;

    // 檢查群組（以左上角 ax,ay 放置）是否與任何現有模塊重疊
    function groupOverlaps(ax, ay) {
      return targets.some(src => {
        // 各成員在新位置的實際座標
        const nx = ax + (src.x - minX);
        const ny = ay + (src.y - minY);
        const nw = src.width * SCALE;
        const nh = src.height * SCALE;
        return modules.some(m => {
          const mw = m.width * SCALE, mh = m.height * SCALE;
          return nx < m.x + mw && nx + nw > m.x && ny < m.y + mh && ny + nh > m.y;
        });
      });
    }

    const GAP = 10;
    const STEP = GAP;
    let bestX = null, bestY = null, bestDist = Infinity;

    for (let layer = 1; layer <= 300 && bestX === null; layer++) {
      const outerL = allMinX - layer * STEP - gW - GAP;
      const outerR = allMaxX + layer * STEP + GAP;
      const outerT = allMinY - layer * STEP - gH - GAP;
      const outerB = allMaxY + layer * STEP + GAP;
      const candidates = [];
      for (let y = outerT; y <= outerB + gH; y += STEP) { candidates.push({ x: outerR, y }); candidates.push({ x: outerL, y }); }
      for (let x = outerL; x <= outerR + gW; x += STEP) { candidates.push({ x, y: outerB }); candidates.push({ x, y: outerT }); }
      candidates.forEach(({ x, y }) => {
        if (groupOverlaps(x, y)) return;
        const cx = x + gW / 2, cy = y + gH / 2;
        const dist = (cx - allCX) ** 2 + (cy - allCY) ** 2;
        if (dist < bestDist) { bestDist = dist; bestX = x; bestY = y; }
      });
    }
    return bestX !== null ? { x: bestX, y: bestY } : { x: allMaxX + GAP, y: allCY - gH / 2 };
  }

  const anchor = findGroupAnchor(groupW, groupH);

  // 先清除目前選取狀態
  if (selectedUid !== null) {
    const prevDiv = document.getElementById(`mod-${selectedUid}`);
    if (prevDiv) prevDiv.classList.remove('selected');
    const prevRow = document.getElementById(`row-${selectedUid}`);
    if (prevRow) prevRow.style.background = '';
    selectedUid = null;
  }
  selectedUids.forEach(uid => {
    const div = document.getElementById(`mod-${uid}`);
    if (div) { div.classList.remove('selected'); div.classList.remove('multi-selected'); }
    const row = document.getElementById(`row-${uid}`);
    if (row) { row.style.background = ''; row.classList.remove('multi-selected-row'); }
  });
  selectedUids.clear();

  // 建立副本：以群組錨點 + 各模塊相對偏移還原相對位置
  const newUids = [];
  const baseTime = Date.now();
  // gid 對照表：原 gid → 新 gid（同群組三件共用一個新 gid）
  const gidMap = {};
  targets.forEach((mod, i) => {
    if (mod.gid && !gidMap[mod.gid]) gidMap[mod.gid] = baseTime + i * 7 + Math.floor(Math.random() * 1000) + 9999;
  });
  targets.forEach((mod, i) => {
    const newUid = baseTime + i * 7 + Math.floor(Math.random() * 100);
    const copy = {
      uid:       newUid,
      id:        mod.id,
      name:      mod.name,
      width:     mod.width,
      height:    mod.height,
      spec:      mod.spec,
      x:          anchor.x + (mod.x - minX),
      y:          anchor.y + (mod.y - minY),
      rotate:     mod.rotate || 0,
      note:       mod.note,
      acrylicQty: 0,
      heightCustomizable: mod.heightCustomizable || false,
      customHeight: mod.customHeight,
      panelHeights: mod.panelHeights ? mod.panelHeights.map(p => typeof p === 'object' ? { ...p } : { h: p, color: '#ffffff', opacity: 1 }) : undefined,
      widthCustomizable: mod.widthCustomizable || false,
      customWidth: mod.customWidth,
      useEdge: mod.useEdge !== undefined ? mod.useEdge : true,
      edgeColor: mod.edgeColor !== undefined ? mod.edgeColor : undefined,
      gid: mod.gid ? gidMap[mod.gid] : undefined,
    };
    modules.push(copy);
    renderModuleDOM(copy);
    newUids.push(newUid);
  });

  // 選取所有新副本（群組選取）
  if (newUids.length === 1) {
    selectModule(newUids[0]);
  } else {
    newUids.forEach(uid => {
      selectedUids.add(uid);
      const div = document.getElementById(`mod-${uid}`);
      if (div) div.classList.add('multi-selected');
    });
  }

  renderTable();
  updateEmptyHint();
  showToast(`已複製 ${targets.length} 個模塊`);
}

// ==========================================
// 多選模式切換（iPad 專用）
// ==========================================
function toggleMultiSelectMode() {
  multiSelectMode = !multiSelectMode;
  const btn = document.getElementById('multiselect-mode-btn');
  if (multiSelectMode) {
    btn.textContent = '☑ 多選模式：開啟';
    btn.classList.add('multiselect-active');
    showToast('多選模式已開啟，點擊模塊可累積加選');
  } else {
    btn.textContent = '☑ 多選模式：關閉';
    btn.classList.remove('multiselect-active');
    clearMultiSelection();
    selectedUid = null;
    showToast('多選模式已關閉');
  }
}

// ==========================================
// 任務二：Panel 抽屜開關（小螢幕專用）
// ==========================================
function openPanelDrawer() {
  document.getElementById('panel').classList.add('panel-open');
  document.getElementById('panel-overlay').classList.add('overlay-show');
  document.body.style.overflow = 'hidden'; // 防止背景捲動
}

function closePanelDrawer() {
  document.getElementById('panel').classList.remove('panel-open');
  document.getElementById('panel-overlay').classList.remove('overlay-show');
  document.body.style.overflow = '';
}

// ==========================================
// 8. 輔助工具 (吐司訊息通知)
// ==========================================

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}
</script>
