        expandSelectionForGid(mod.gid);
      } else {
        selectModule(mod.uid);
      }
      startDrag(e, mod);
    }
  });

  // 阻止 click 冒泡到 canvas，避免觸發 handleCanvasClick 清空選取
  div.addEventListener('click', (e) => e.stopPropagation());

  div.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    if (multiSelectMode) {
      // 多選模式：gid 群組一律選整組
      if (mod.gid) {
        expandSelectionForGid(mod.gid);
      } else {
        toggleModuleSelection(mod.uid);
      }
    } else if (selectedUids.size > 1 && selectedUids.has(mod.uid)) {
      // 已在多選集合中：直接群組拖曳
      startDrag(e.touches[0], mod);
    } else {
      // gid 群組：整組進入多選再拖曳
      if (mod.gid) {
        expandSelectionForGid(mod.gid);
      } else {
        selectModule(mod.uid);
      }
      startDrag(e.touches[0], mod);
    }
  }, { passive: true });



  viewport.appendChild(div);
}

function updateModuleDOMPosition(mod) {
  const div = document.getElementById(`mod-${mod.uid}`);
  if (div) {
    div.style.left = `${mod.x}px`;
    div.style.top = `${mod.y}px`;
    div.style.transform = `rotate(${mod.rotate}deg)`;
  }
}

function selectModule(uid) {
  // 清除舊單選
  if (selectedUid !== null) {
    const prevDiv = document.getElementById(`mod-${selectedUid}`);
    if (prevDiv) prevDiv.classList.remove('selected');
    const prevRow = document.getElementById(`row-${selectedUid}`);
    if (prevRow) prevRow.style.background = '';
  }
  // 清除多選
  clearMultiSelection();

  selectedUid = uid;

  if (selectedUid !== null) {
    const currDiv = document.getElementById(`mod-${selectedUid}`);
    if (currDiv) currDiv.classList.add('selected');
    const currRow = document.getElementById(`row-${selectedUid}`);
    if (currRow) currRow.style.background = '#e1f0fe';
  }
}

// Ctrl / ⌘ + 點擊：加入或移出多選集合
function toggleModuleSelection(uid) {
  // 若目前是單選狀態，先將單選模塊納入多選集合
  if (selectedUid !== null && selectedUids.size === 0) {
    const prevDiv = document.getElementById(`mod-${selectedUid}`);
    if (prevDiv) { prevDiv.classList.remove('selected'); prevDiv.classList.add('multi-selected'); }
    const prevRow = document.getElementById(`row-${selectedUid}`);
    if (prevRow) { prevRow.style.background = ''; prevRow.classList.add('multi-selected-row'); }
    selectedUids.add(selectedUid);
    selectedUid = null;
  }

  if (selectedUids.has(uid)) {
    // 已在集合中 → 移除高亮，從集合刪除
    const div = document.getElementById(`mod-${uid}`);
    if (div) div.classList.remove('multi-selected');
    const row = document.getElementById(`row-${uid}`);
    if (row) row.classList.remove('multi-selected-row');
    selectedUids.delete(uid);

    // 若集合剩下 1 個，退回單選模式
    if (selectedUids.size === 1) {
      const lastUid = [...selectedUids][0];
      selectedUids.clear();
      // 直接設定單選，不呼叫 selectModule（避免它再次 clearMultiSelection）
      selectedUid = lastUid;
      const lastDiv = document.getElementById(`mod-${lastUid}`);
      if (lastDiv) lastDiv.classList.add('selected');
      const lastRow = document.getElementById(`row-${lastUid}`);
      if (lastRow) lastRow.style.background = '#e1f0fe';
    } else if (selectedUids.size === 0) {
      // 集合清空，取消所有選取
      selectedUid = null;
    }
  } else {
    // 不在集合中 → 加入
    selectedUids.add(uid);
    const div = document.getElementById(`mod-${uid}`);
    if (div) div.classList.add('multi-selected');
    const row = document.getElementById(`row-${uid}`);
    if (row) row.classList.add('multi-selected-row');
  }
}

// ==========================================
// 多選管理
// ==========================================
function clearMultiSelection() {
  selectedUids.forEach(uid => {
    const div = document.getElementById(`mod-${uid}`);
    if (div) div.classList.remove('multi-selected');
    const row = document.getElementById(`row-${uid}`);
    if (row) row.classList.remove('multi-selected-row');
  });
  selectedUids.clear();
}

function applyMultiSelection(uids) {
  // 先清除單選
  if (selectedUid !== null) {
    const prevDiv = document.getElementById(`mod-${selectedUid}`);
    if (prevDiv) prevDiv.classList.remove('selected');
    const prevRow = document.getElementById(`row-${selectedUid}`);
    if (prevRow) prevRow.style.background = '';
    selectedUid = null;
  }
  clearMultiSelection();

  uids.forEach(uid => {
    selectedUids.add(uid);
    const div = document.getElementById(`mod-${uid}`);
    if (div) div.classList.add('multi-selected');
    const row = document.getElementById(`row-${uid}`);
    if (row) row.classList.add('multi-selected-row');
  });
}

// ==========================================
// gid 群組整組選取輔助
// ==========================================
// 將同 gid 的所有成員加入 selectedUids（多選模式），
// 先清除原有單選/多選狀態，確保整組乾淨進入多選。
function expandSelectionForGid(gid) {
  const members = modules.filter(m => m.gid === gid);
  if (members.length === 0) return;

  // 清除舊選取
  if (selectedUid !== null) {
    const prevDiv = document.getElementById(`mod-${selectedUid}`);
    if (prevDiv) prevDiv.classList.remove('selected');
    const prevRow = document.getElementById(`row-${selectedUid}`);
    if (prevRow) prevRow.style.background = '';
    selectedUid = null;
  }
  // 注意：不清空現有 selectedUids，讓框選結果可以累積
  // 但若目前 selectedUids 不含任何 gid 成員，則視為全新選取，先清空
  const alreadyHasMember = members.some(m => selectedUids.has(m.uid));
  if (!alreadyHasMember) {
    clearMultiSelection();
  }

  members.forEach(m => {
    selectedUids.add(m.uid);
    const div = document.getElementById(`mod-${m.uid}`);
    if (div) { div.classList.remove('selected'); div.classList.add('multi-selected'); }
    const row = document.getElementById(`row-${m.uid}`);
    if (row) { row.style.background = ''; row.classList.add('multi-selected-row'); }
  });
}

// ==========================================
// 框選引擎
// ==========================================
function initBoxSelect() {
  const canvasEl = document.getElementById('canvas');
  const selRect = document.getElementById('selection-rect');

  canvasEl.addEventListener('mousedown', (e) => {
    // 只有直接點到 canvas 背景（非模塊）才啟動框選
    if (e.target !== canvasEl && e.target.id !== 'empty-hint' && e.target.id !== 'selection-rect' && e.target.id !== 'canvas-viewport') return;
    // 中鍵拖曳或按住空白鍵時，交由畫布平移功能處理，框選不介入
    if (e.button !== 0) return;

    isBoxSelecting = true;
    const rect = canvasEl.getBoundingClientRect();
    // 框選起始點：視覺坐標（用於畫選框）
    boxSelectStartX = e.clientX - rect.left;
    boxSelectStartY = e.clientY - rect.top;

    selRect.style.left   = boxSelectStartX + 'px';
    selRect.style.top    = boxSelectStartY + 'px';
    selRect.style.width  = '0px';
    selRect.style.height = '0px';
    selRect.style.display = 'block';

    const onMove = (ev) => {
      if (!isBoxSelecting) return;
      const cx = ev.clientX - rect.left;
      const cy = ev.clientY - rect.top;

      // 選框繪製在視覺空間
      const x = Math.min(cx, boxSelectStartX);
      const y = Math.min(cy, boxSelectStartY);
      const w = Math.abs(cx - boxSelectStartX);
      const h = Math.abs(cy - boxSelectStartY);

      selRect.style.left   = x + 'px';
      selRect.style.top    = y + 'px';
      selRect.style.width  = w + 'px';
      selRect.style.height = h + 'px';
    };

    const onUp = (ev) => {
      if (!isBoxSelecting) return;
      isBoxSelecting = false;
      selRect.style.display = 'none';

      const cx = ev.clientX - rect.left;
      const cy = ev.clientY - rect.top;

      if (Math.abs(cx - boxSelectStartX) < 4 && Math.abs(cy - boxSelectStartY) < 4) {
        // 單點空白處：清除所有選取（含多選）
        clearMultiSelection();
        selectModule(null);
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        skipNextCanvasClick = false;
        return;
      }

      skipNextCanvasClick = true;

      // 轉換為邏輯坐標（模塊的 x/y 為邏輯像素）後做交集判斷，需扣除目前畫布平移量
      const sx = (Math.min(cx, boxSelectStartX) - panX) / canvasZoom;
      const sy = (Math.min(cy, boxSelectStartY) - panY) / canvasZoom;
      const ex = (Math.max(cx, boxSelectStartX) - panX) / canvasZoom;
      const ey = (Math.max(cy, boxSelectStartY) - panY) / canvasZoom;

      const matched = modules.filter(mod => {
        const wPx = mod.width * SCALE;
        const hPx = mod.height * SCALE;
        const modCx = mod.x + wPx / 2;
        const modCy = mod.y + hPx / 2;
        return modCx >= sx && modCx <= ex && modCy >= sy && modCy <= ey;
      });

      if (matched.length === 1) {
        if (matched[0].gid) {
          expandSelectionForGid(matched[0].gid);
        } else {
          selectModule(matched[0].uid);
        }
      } else if (matched.length > 1) {
        applyMultiSelection(matched.map(m => m.uid));
        // 擴展所有被框選到的 gid 群組
        const gids = new Set(matched.filter(m => m.gid).map(m => m.gid));
        gids.forEach(gid => expandSelectionForGid(gid));
        showToast(`已選取 ${selectedUids.size} 個模塊`);
      } else {
        selectModule(null);
      }

      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // ── 觸控：單指在畫布空白處拖曳 → 框選 ──
  canvasEl.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    const touch = e.touches[0];
    const target = touch.target;
    if (target !== canvasEl && target.id !== 'empty-hint' && target.id !== 'selection-rect' && target.id !== 'canvas-viewport') return;

    isBoxSelecting = true;
    const rect = canvasEl.getBoundingClientRect();
    boxSelectStartX = touch.clientX - rect.left;
    boxSelectStartY = touch.clientY - rect.top;

    selRect.style.left   = boxSelectStartX + 'px';
    selRect.style.top    = boxSelectStartY + 'px';
    selRect.style.width  = '0px';
    selRect.style.height = '0px';
    selRect.style.display = 'block';

    const onTouchMove = (ev) => {
      if (!isBoxSelecting || ev.touches.length !== 1) return;
      const t = ev.touches[0];
      const cx = t.clientX - rect.left;
      const cy = t.clientY - rect.top;
      selRect.style.left   = Math.min(cx, boxSelectStartX) + 'px';
      selRect.style.top    = Math.min(cy, boxSelectStartY) + 'px';
      selRect.style.width  = Math.abs(cx - boxSelectStartX) + 'px';
      selRect.style.height = Math.abs(cy - boxSelectStartY) + 'px';
    };

    const onTouchEnd = (ev) => {
      if (!isBoxSelecting) return;
      isBoxSelecting = false;
      selRect.style.display = 'none';

      const lastTouch = ev.changedTouches[0];
      const cx = lastTouch.clientX - rect.left;
      const cy = lastTouch.clientY - rect.top;

      canvasEl.removeEventListener('touchmove', onTouchMove);
      canvasEl.removeEventListener('touchend', onTouchEnd);

      if (Math.abs(cx - boxSelectStartX) < 8 && Math.abs(cy - boxSelectStartY) < 8) {
        clearMultiSelection();
        selectModule(null);
        skipNextCanvasClick = false;
        return;
      }

      skipNextCanvasClick = true;
      const sx = (Math.min(cx, boxSelectStartX) - panX) / canvasZoom;
      const sy = (Math.min(cy, boxSelectStartY) - panY) / canvasZoom;
      const ex = (Math.max(cx, boxSelectStartX) - panX) / canvasZoom;
      const ey = (Math.max(cy, boxSelectStartY) - panY) / canvasZoom;

      const matched = modules.filter(mod => {
        const modCx = mod.x + (mod.width * SCALE) / 2;
        const modCy = mod.y + (mod.height * SCALE) / 2;
        return modCx >= sx && modCx <= ex && modCy >= sy && modCy <= ey;
      });

      if (matched.length === 1) {
        if (matched[0].gid) {
          expandSelectionForGid(matched[0].gid);
        } else {
          selectModule(matched[0].uid);
        }
      } else if (matched.length > 1) {
        applyMultiSelection(matched.map(m => m.uid));
        // 擴展所有被框選到的 gid 群組
        const gids = new Set(matched.filter(m => m.gid).map(m => m.gid));
        gids.forEach(gid => expandSelectionForGid(gid));
        showToast(`已選取 ${selectedUids.size} 個模塊`);
      } else {
        selectModule(null);
      }
    };

    canvasEl.addEventListener('touchmove', onTouchMove, { passive: true });
    canvasEl.addEventListener('touchend', onTouchEnd, { passive: true });
  }, { passive: true });
}

function handleCanvasClick(e) {
  if (skipNextCanvasClick) {
    skipNextCanvasClick = false;
    return;
  }
  // 點擊畫布空白處：取消所有選取（含多選）
  closeAllColorPopups();
  clearMultiSelection();
  selectModule(null);
}

// ==========================================
// 4. 拖拽引擎 (支援滑鼠與觸控、多選群組拖拽)
// ==========================================
function startDrag(e, mod) {
  // 判斷是否為多選群組拖拽
  const isGroupDrag = selectedUids.size > 1 && selectedUids.has(mod.uid);

  isDragging = true;
  let hasDragged = false;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  moduleStartX = mod.x;
  moduleStartY = mod.y;

  // 記錄群組中每個模塊的起始位置
  let groupStartPositions = [];
  if (isGroupDrag) {
    groupStartPositions = [...selectedUids].map(uid => {
      const m = modules.find(x => x.uid === uid);
      return m ? { uid, x: m.x, y: m.y } : null;
    }).filter(Boolean);
  }

  // 記錄拖曳開始時，緊鄰此屏風的轉柱 uid（供放開後對舊鄰居觸發重新計算）
  const SCREEN_IDS_DRAG = new Set(['P3N-LSIDE', 'P3N-RSIDE', 'P3N-BPANEL', 'P3N-SIDE-N']);
  const prevNeighborPostUids = new Set();
  const collectNeighborPosts = (bpanel) => {
    if (!bpanel || bpanel.id !== 'P3N-BPANEL') return;
    let groupLeft  = bpanel.x;
    let groupRight = bpanel.x + bpanel.width * SCALE;
    let groupTop   = bpanel.y;
    let groupBot   = bpanel.y + bpanel.height * SCALE;
    if (bpanel.gid) {
      modules.forEach(m => {
        if (m.gid !== bpanel.gid) return;
        groupLeft  = Math.min(groupLeft,  m.x);
        groupRight = Math.max(groupRight, m.x + m.width  * SCALE);
        groupTop   = Math.min(groupTop,   m.y);
        groupBot   = Math.max(groupBot,   m.y + m.height * SCALE);
      });
    }
    modules.forEach(m => {
      if (m.id !== 'P3N-POST') return;
      const postRight = m.x + m.width * SCALE;
      const overlaps  = m.y < groupBot && (m.y + m.height * SCALE) > groupTop;
      if (!overlaps) return;
      const isLeft  = Math.abs(postRight  - groupLeft)  <= SNAP_ADJ_TOLERANCE;
      const isRight = Math.abs(groupRight - m.x)        <= SNAP_ADJ_TOLERANCE;
      if (isLeft || isRight) prevNeighborPostUids.add(m.uid);
    });
  };
  if (!isGroupDrag && SCREEN_IDS_DRAG.has(mod.id)) {
    const bp = mod.id === 'P3N-BPANEL'
      ? mod
      : (mod.gid ? modules.find(m => m.gid === mod.gid && m.id === 'P3N-BPANEL') : null);
    collectNeighborPosts(bp);
  } else if (isGroupDrag) {
    selectedUids.forEach(uid => {
      const m = modules.find(mo => mo.uid === uid);
      if (m && m.id === 'P3N-BPANEL') collectNeighborPosts(m);
    });
  }

  const moveHandler = (evt) => {
    if (!isDragging) return;
    // 觸控拖曳時阻止頁面捲動
    if (evt.cancelable && evt.touches) evt.preventDefault();
    const clientX = evt.clientX !== undefined ? evt.clientX : (evt.touches && evt.touches[0].clientX);
    const clientY = evt.clientY !== undefined ? evt.clientY : (evt.touches && evt.touches[0].clientY);

    if (clientX === undefined || clientY === undefined) return;

    // 除以縮放比例，轉為邏輯像素偏移
    const dx = (clientX - dragStartX) / canvasZoom;
    const dy = (clientY - dragStartY) / canvasZoom;

    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
      hasDragged = true;
    }

    const canvasEl = document.getElementById('canvas');
    // 邏輯邊界（模塊坐標空間），需依目前畫布平移量換算出「目前可視範圍」
    const viewMinX = -panX / canvasZoom;
    const viewMinY = -panY / canvasZoom;
    const viewMaxX = viewMinX + canvasEl.clientWidth / canvasZoom;
    const viewMaxY = viewMinY + canvasEl.clientHeight / canvasZoom;

    if (isGroupDrag) {
      // 群組拖拽：先算出各模塊暫定位置，再對整個群組的邊界框做吸附
      const tentative = groupStartPositions.map(({ uid, x: sx, y: sy }) => {
        const m = modules.find(mo => mo.uid === uid);
        if (!m) return null;
        const wPx = m.width * SCALE;
        const hPx = m.height * SCALE;
        return { m, x: Math.min(Math.max(viewMinX, sx + dx), viewMaxX - wPx), y: Math.min(Math.max(viewMinY, sy + dy), viewMaxY - hPx) };
      }).filter(Boolean);

      // 計算群組邊界框
      let gMinX = Infinity, gMinY = Infinity, gMaxX = -Infinity, gMaxY = -Infinity;
      tentative.forEach(({ m, x, y }) => {
        gMinX = Math.min(gMinX, x);
        gMinY = Math.min(gMinY, y);
        gMaxX = Math.max(gMaxX, x + m.width * SCALE);
        gMaxY = Math.max(gMaxY, y + m.height * SCALE);
      });
      // 暫時套用位置，讓 getModuleWorldVertices 能讀取到拖曳後的座標
      const savedPositions = tentative.map(({ m }) => ({ m, ox: m.x, oy: m.y }));
      tentative.forEach(({ m, x, y }) => { m.x = x; m.y = y; });
      const draggedModsList = tentative.map(t => t.m);
      const snap = getSnapDelta(gMinX, gMinY, gMaxX - gMinX, gMaxY - gMinY, selectedUids, draggedModsList);
      // 還原（後面會加上 snap.dx/dy 再正式設定）
      savedPositions.forEach(({ m, ox, oy }) => { m.x = ox; m.y = oy; });

      tentative.forEach(({ m, x, y }) => {
        m.x = x + snap.dx;
        m.y = y + snap.dy;
        // 切線對齊：在法線吸附發生後，若偏移量在容許範圍內才套用
        const tLen = Math.sqrt(snap.tdx * snap.tdx + snap.tdy * snap.tdy);
        if (tLen > 0 && tLen <= TANGENT_SNAP_THRESHOLD / canvasZoom) {
          m.x += snap.tdx;
          m.y += snap.tdy;
        }
        updateModuleDOMPosition(m);
      });
    } else {
      // 單選拖拽
      const wPx = mod.width * SCALE;
      const hPx = mod.height * SCALE;
      let nx = Math.min(Math.max(viewMinX, moduleStartX + dx), viewMaxX - wPx);
      let ny = Math.min(Math.max(viewMinY, moduleStartY + dy), viewMaxY - hPx);

      // 先暫時更新模塊位置，讓 getModuleWorldVertices 能讀取到最新座標
      const origX = mod.x, origY = mod.y;
      mod.x = nx; mod.y = ny;
      const snap = getSnapDelta(nx, ny, wPx, hPx, new Set([mod.uid]), [mod]);
      mod.x = origX; mod.y = origY; // 還原，讓後面統一設定

      nx += snap.dx;
      ny += snap.dy;
      // 切線對齊：在法線吸附發生後，若偏移量在容許範圍內才套用
      const tLen = Math.sqrt(snap.tdx * snap.tdx + snap.tdy * snap.tdy);
      if (tLen > 0 && tLen <= TANGENT_SNAP_THRESHOLD / canvasZoom) {
        nx += snap.tdx;
        ny += snap.tdy;
      }

      mod.x = nx;
      mod.y = ny;
      updateModuleDOMPosition(mod);
    }
  };

  const upHandler = () => {
    isDragging = false;
    skipNextCanvasClick = true;
    document.removeEventListener("mousemove", moveHandler);
    document.removeEventListener("mouseup", upHandler);
    document.removeEventListener("touchmove", moveHandler);
    document.removeEventListener("touchend", upHandler);

    // 轉柱放開後，依鄰接屏風模塊自動同步高度
    if (!isGroupDrag && mod.id === 'P3N-POST') {
      syncPostHeightToNeighbors(mod);
    }

    // 屏風模塊放開後，同步緊鄰轉柱高度
    const SCREEN_IDS = new Set(['P3N-LSIDE', 'P3N-RSIDE', 'P3N-BPANEL', 'P3N-SIDE-N']);
    if (!isGroupDrag && SCREEN_IDS.has(mod.id)) {
      // 單選：取 mod 所屬 gid 的 BPANEL，或 mod 本身（若已是 BPANEL）
      const bp = mod.id === 'P3N-BPANEL'
        ? mod
        : (mod.gid ? modules.find(m => m.gid === mod.gid && m.id === 'P3N-BPANEL') : null);
      if (bp) syncNeighborPosts(bp);
    } else if (isGroupDrag) {
      // 群組拖曳：對 selectedUids 內所有 BPANEL 觸發
      selectedUids.forEach(uid => {
        const m = modules.find(mo => mo.uid === uid);
        if (m && m.id === 'P3N-BPANEL') syncNeighborPosts(m);
      });
    }

    // 對拖曳前的舊鄰居轉柱重新計算：屏風離開後鄰居狀態已更新，
    // 讓轉柱依剩餘鄰居（或無鄰居）自動降回較低高度或預設值
    prevNeighborPostUids.forEach(uid => {
      const post = modules.find(m => m.uid === uid);
      if (post) syncPostHeightToNeighbors(post);
    });
  };

  document.addEventListener('mousemove', moveHandler);
  document.addEventListener('mouseup', upHandler);
  // passive: false 確保 iOS Safari 不會搶奪觸控使頁面捲動
  document.addEventListener('touchmove', moveHandler, { passive: false });
  document.addEventListener('touchend', upHandler);
}

// ==========================================
// 5. 元件控制指令（刪除/清空）
// ==========================================
function deleteSelected() {
  const toDelete = new Set();
  if (selectedUid !== null) toDelete.add(selectedUid);
  selectedUids.forEach(uid => toDelete.add(uid));

  if (toDelete.size === 0) {
    showToast('請先選取要刪除的模塊');
    return;
  }

  // gid 群組：若只選到部分成員，自動補齊整組一起刪除
  const gidsToDelete = new Set(
    [...toDelete].map(uid => modules.find(m => m.uid === uid)?.gid).filter(Boolean)
  );
  gidsToDelete.forEach(gid => {
    modules.filter(m => m.gid === gid).forEach(m => toDelete.add(m.uid));
  });

  toDelete.forEach(uid => {
    const div = document.getElementById(`mod-${uid}`);
    if (div) div.remove();
    modules = modules.filter(m => m.uid !== uid);
  });

  selectedUid = null;
  selectedUids.clear();

  renderTable();
  updateEmptyHint();
  showToast(`已刪除 ${toDelete.size} 個模塊`);
}

function clearCanvas() {
  if (modules.length === 0) {
    showToast('畫布已是空的');
    return;
  }
  if (!confirm('確定要清空所有配置嗎？')) return;

  modules.forEach(mod => {
    const div = document.getElementById(`mod-${mod.uid}`);
    if (div) div.remove();
  });
  modules = [];
  selectedUid = null;
  selectedUids.clear();

  renderTable();
  updateEmptyHint();
  showToast('已清空所有配置');
}

// ==========================================
// 6. 配置清單表格與 CSV 匯出
// ==========================================
function updateEmptyHint() {
  const hint = document.getElementById('empty-hint');
  if (hint) hint.style.display = modules.length === 0 ? '' : 'none';
}

/**
 * 依 mod.useEdge 切換 LSIDE / RSIDE 的畫布 SVG，
 * 並同步更新模塊寬度（收邊 40mm ↔ 不收邊 32mm）與群組內相鄰模塊位置。
 */
function refreshSideEdgeSVG(mod) {
  if (mod.id !== 'P3N-LSIDE' && mod.id !== 'P3N-RSIDE') return;

  // ── 1. 更新寬度資料（mm → 邏輯像素）──
  const newWidthMM = mod.useEdge ? 40 : 32;
  const oldWidthPx = mod.width * SCALE;
  mod.width = newWidthMM;
  const newWidthPx = mod.width * SCALE;

  // ── 2. 更新 DOM 尺寸 ──
  const div = document.getElementById(`mod-${mod.uid}`);
  if (div) div.style.width = `${newWidthPx}px`;

  // ── 3. 更新 SVG 圖示 ──
  const imgEl = document.getElementById(`img-${mod.uid}`);
  if (imgEl) {
    const rawSvg = getEffectiveModuleSVG(mod);
    const svgSrc = rawSvg.replace(/<svg([^>]*)>/, (m, attrs) => {
      if (/preserveAspectRatio/.test(attrs)) return m;
      return `<svg${attrs} preserveAspectRatio="none">`;
    });
    imgEl.src = URL.createObjectURL(new Blob([svgSrc], { type: 'image/svg+xml' }));
  }

  // ── 4. 群組內同步相鄰模塊 x 座標 ──
  if (!mod.gid) return;
  const lside  = modules.find(m => m.gid === mod.gid && m.id === 'P3N-LSIDE');
  const bpanel = modules.find(m => m.gid === mod.gid && m.id === 'P3N-BPANEL');
  const rside  = modules.find(m => m.gid === mod.gid && m.id === 'P3N-RSIDE');
  if (!lside || !bpanel || !rside) return;

  const delta = newWidthPx - oldWidthPx;

  if (mod.id === 'P3N-LSIDE') {
    // LSIDE 寬度變動 → BPANEL 和 RSIDE 向右/左位移
    bpanel.x += delta;
    rside.x  += delta;
    updateModuleDOMPosition(bpanel);
    updateModuleDOMPosition(rside);
  } else {
    // RSIDE 寬度變動 → 只更新自身位置（x 不變，寬度從右側展開）
    // 維持 RSIDE 左緣緊貼 BPANEL 右緣
    rside.x = bpanel.x + bpanel.width * SCALE;
    updateModuleDOMPosition(rside);
  }
}

/**
 * 更新模塊的訂製高度：重新計算 height、更新 DOM 尺寸、重繪 SVG
 */
/**
 * 當轉柱（P3N-POST）高度改變後，同步更新配置清單的型號欄與 note 欄。
 * 若新高度非標準規格，型號留空並在 note 加入「訂製轉柱」；
 * 若改回標準規格，移除 note 中的「訂製轉柱」標記。
 */
/**
 * checkbox 切換後，即時更新群組列的名稱欄與型號欄（收邊條顯示邏輯）。
 */
function syncGroupRowSideId(bpanel, lside, rside, tdName, tdId, overrideH) {
  const hasEdge = (lside && lside.useEdge !== false) || (rside && rside.useEdge !== false);
  const edgeCount = ((lside && lside.useEdge !== false) ? 1 : 0) + ((rside && rside.useEdge !== false) ? 1 : 0);
  const panelH = overrideH != null ? overrideH : calcBPanelTotalH(bpanel);
  const panelW = bpanel.customWidth || 700;
  const sideId = hasEdge ? getSideDisplayId(panelH) : '';
  const isCustomSide = hasEdge && sideId === '';

  // 同步 BPANEL 自身型號
  const bpanelDisplayId = getBPanelDisplayId(panelH, panelW);

  // 同步 bpanel.note（含訂製面板標記 + 訂製收邊條標記）
  let note = (bpanel.note || '')
    .replace(/\s*訂製收邊條/g, '')
    .replace(/\s*訂製面板高度/g, '')
    .replace(/\s*訂製面板寬度/g, '')
    .trim();
  const customPanelNote = getBPanelCustomNote(panelH, panelW);
  if (customPanelNote) note = note ? note + ' ' + customPanelNote : customPanelNote;
  if (hasEdge && isCustomSide) note = note ? note + ' 訂製收邊條' : '訂製收邊條';
  bpanel.note = note;
  const noteEl = document.getElementById(`note-${bpanel.uid}`);
  if (noteEl) noteEl.value = bpanel.note;

  // 同步名稱欄、型號欄
  if (hasEdge) {
    tdName.innerHTML = `<span style="display:block;">屏風模塊</span><span style="display:block;color:var(--text-secondary);font-size:11px;">收邊條工本費</span>`;
    tdId.innerHTML = `<span style="display:block;">${bpanelDisplayId}</span><span style="display:block;color:var(--text-secondary);font-size:11px;">${sideId}</span>`;
  } else {
    tdName.textContent = '屏風模塊';
    tdId.textContent = bpanelDisplayId;
  }

  // 同步數量欄
  const tdQty = document.getElementById(`tdqty-group-${bpanel.uid}`);
  if (tdQty) {
    if (edgeCount > 0) {
      tdQty.innerHTML = `<span style="display:block;">1</span><span style="display:block;color:var(--text-secondary);font-size:11px;">${edgeCount}</span>`;
    } else {
      tdQty.textContent = '1';
    }
  }
}

function syncPostTableRow(mod) {
  if (mod.id !== 'P3N-POST') return;
  const newId = getPostDisplayId(mod.customHeight || mod.height);
  const isCustom = newId === '';

  // 同步 mod.note：加/移除「訂製轉柱」標記
  let note = (mod.note || '').replace(/\s*訂製轉柱/g, '').trim();
  if (isCustom) note = note ? note + ' 訂製轉柱' : '訂製轉柱';
  mod.note = note;

  // 更新型號欄 DOM
  const tdId = document.getElementById(`tdid-${mod.uid}`);
  if (tdId) tdId.textContent = newId;

  // 更新 note 欄 DOM
  const noteEl = document.getElementById(`note-${mod.uid}`);
  if (noteEl) noteEl.value = mod.note;
}

function refreshModuleHeight(mod, newHeightMM) {
  // 最小高度限制：至少 50mm（帽頭本身很薄，以 mm 計算下限即可）
  const clampedH = Math.max(50, Math.round(newHeightMM));
  mod.customHeight = clampedH;
  mod.height = clampedH;
  mod.spec = mod.spec.replace(/H\d+/, `H${clampedH}`);

  // 更新畫布上的 DOM 元素尺寸
  const div = document.getElementById(`mod-${mod.uid}`);
  if (div) {
    div.style.height = `${clampedH * SCALE}px`;
    // 重新生成 SVG
    const imgEl = document.getElementById(`img-${mod.uid}`);
    if (imgEl) {
      const rawSvg = getEffectiveModuleSVG(mod);
      const svgSrc = rawSvg.replace(/<svg([^>]*)>/, (m, attrs) => {
        if (/preserveAspectRatio/.test(attrs)) return m;
        return `<svg${attrs} preserveAspectRatio="none">`;
      });
      const blob = new Blob([svgSrc], { type: 'image/svg+xml' });
      imgEl.src = URL.createObjectURL(blob);
    }
  }
}

/**
 * 依 mod.panelHeights 重新生成 P3N-BPANEL 的 SVG 並更新畫布 DOM。
 *
 * mod.height（mm）= 固定區換算mm + 各片白色高度加總
 *   固定區 SVG單位 = GRP_START(3.33) + n*REL_WHITE_Y(4.26) + BOT_H(2.83) + 0.5
 *   換算比例 SVG_PER_MM = 201.5 / 750
 */
function refreshBPanelSVG(mod) {
  const heights = (Array.isArray(mod.panelHeights) && mod.panelHeights.length)
    ? mod.panelHeights : [{ h: 708, color: '#ffffff', opacity: 1, material: '平面烤漆' }];
  mod.panelHeights = heights;

  // 計算 mod.height（mm）：固定區換算 + 各片白色高度
  const SVG_PER_MM = 201.5 / 750;
  const fixedSVG   = 3.33 + heights.length * 4.26 + 2.83 + 0.5;
  const fixedMM    = fixedSVG / SVG_PER_MM;
  const whiteMM    = heights.reduce((sum, p) => sum + ((typeof p === 'object') ? p.h : p), 0);
  mod.height = Math.round(fixedMM + whiteMM);

  // 同步更新 spec 的 H 值（面板總高）
  const _bpTotalH = getBPanelTotalH(mod);
  mod.spec = mod.spec.replace(/H\d+/, `H${_bpTotalH}`);

  // 更新畫布 DOM
  const div = document.getElementById(`mod-${mod.uid}`);
  if (div) {
    div.style.height = `${mod.height * SCALE}px`;
    const imgEl = document.getElementById(`img-${mod.uid}`);
    if (imgEl) {
      const rawSvg = generateBPanelSVG(heights, mod.customWidth || 700, mod.edgeColor);
      const svgSrc = rawSvg.replace(/<svg([^>]*)>/, (m, attrs) => {
        if (/preserveAspectRatio/.test(attrs)) return m;
        return `<svg${attrs} preserveAspectRatio="none">`;
      });
      const blob = new Blob([svgSrc], { type: 'image/svg+xml' });
      imgEl.src = URL.createObjectURL(blob);
    }
  }

  // 若為屏風模塊群組的 BPANEL，同步 LSIDE/RSIDE 高度
  if (mod.gid) syncGidSidePanels(mod);

  // 同步緊鄰轉柱高度（面板總高變更後立即更新，高度未變則內部略過）
  syncNeighborPosts(mod);
}

/**
 * 當 gid 群組中的 BPANEL 高度變動時，
 * 同步更新同群組的 LSIDE / RSIDE 的 customHeight、height 及畫布 DOM。
 */
function syncGidSidePanels(bpanel) {
  if (!bpanel.gid) return;
  const newH = bpanel.height; // mm
  modules.forEach(m => {
    if (m.gid !== bpanel.gid || m.uid === bpanel.uid) return;
    if (m.id !== 'P3N-LSIDE' && m.id !== 'P3N-RSIDE') return;
    m.customHeight = newH;
    m.height = newH;
    const sideDiv = document.getElementById(`mod-${m.uid}`);
    if (sideDiv) {
      sideDiv.style.height = `${newH * SCALE}px`;
      // 重繪 SVG（高度改變）
      const imgEl = document.getElementById(`img-${m.uid}`);
      if (imgEl) {
        const rawSvg = getEffectiveModuleSVG(m);
        const svgSrc = rawSvg.replace(/<svg([^>]*)>/, (mt, attrs) => {
          if (/preserveAspectRatio/.test(attrs)) return mt;
          return `<svg${attrs} preserveAspectRatio="none">`;
        });
        const blob = new Blob([svgSrc], { type: 'image/svg+xml' });
        imgEl.src = URL.createObjectURL(blob);
      }
    }
  });
}

/**
 * 收邊色變更後，重繪同 gid 群組中 LSIDE / RSIDE 的畫布 SVG。
 * 資料已由呼叫端寫入 bpanel.edgeColor，此函式只負責 DOM 更新。
 */
function refreshEdgeColorSVG(bpanel) {
  if (!bpanel.gid) return;
  // 重繪同 gid 的 LSIDE / RSIDE，以及 BPANEL 自身的頂部橫條
  modules.forEach(m => {
    if (m.gid !== bpanel.gid) return;
    if (m.id !== 'P3N-LSIDE' && m.id !== 'P3N-RSIDE' && m.id !== 'P3N-BPANEL') return;
    const imgEl = document.getElementById(`img-${m.uid}`);
    if (!imgEl) return;
    const rawSvg = getEffectiveModuleSVG(m);
    const svgSrc = rawSvg.replace(/<svg([^>]*)>/, (mt, attrs) => {
      if (/preserveAspectRatio/.test(attrs)) return mt;
      return `<svg${attrs} preserveAspectRatio="none">`;
    });
    const blob = new Blob([svgSrc], { type: 'image/svg+xml' });
    imgEl.src = URL.createObjectURL(blob);
  });
}

/**
 * 更新模塊的訂製寬度：重新計算 width、更新 DOM 尺寸、重繪 SVG
 * 目前僅 P3N-BPANEL 支援（widthCustomizable = true）
 */
function refreshModuleWidth(mod, newWidthMM) {
  const clamped = Math.max(200, Math.min(1800, Math.round(newWidthMM)));
  mod.customWidth = clamped;

  // width（邏輯像素）= 原始 700mm 對應 636px → 等比換算
  const W_RATIO = 636 / 700;
  mod.width = Math.round(clamped * W_RATIO);

  // 更新 spec 中的 W 欄位，並確保 H 使用面板總高
  const _rwTotalH = (mod.id === 'P3N-BPANEL') ? getBPanelTotalH(mod) : null;
  if (_rwTotalH !== null) {
    mod.spec = mod.spec.replace(/H\d+/, `H${_rwTotalH}`);
  }
  mod.spec = mod.spec.replace(/W\d+/, `W${clamped}`);

  // 更新畫布 DOM 寬度
  const div = document.getElementById(`mod-${mod.uid}`);
  if (div) {
    div.style.width = `${mod.width * SCALE}px`;
    // 重繪 SVG（寬度變動時面板主體 viewBox 需重算）
    const imgEl = document.getElementById(`img-${mod.uid}`);
    if (imgEl) {
      const rawSvg = getEffectiveModuleSVG(mod);
      const svgSrc = rawSvg.replace(/<svg([^>]*)>/, (m, attrs) => {
        if (/preserveAspectRatio/.test(attrs)) return m;
        return `<svg${attrs} preserveAspectRatio="none">`;
      });
      const blob = new Blob([svgSrc], { type: 'image/svg+xml' });
      imgEl.src = URL.createObjectURL(blob);
    }
  }

  // 同步更新配置清單（先更新清單，再同步位置，避免 DOM 重建干擾座標）
  renderTable();

  // 若為屏風模塊群組的 BPANEL，同步 RSIDE 的 x 座標（BPANEL 寬度變動時 RSIDE 需位移）
  if (mod.gid) {
    const rside = modules.find(m => m.gid === mod.gid && m.id === 'P3N-RSIDE');
    if (rside) {
      rside.x = mod.x + mod.width * SCALE;
      updateModuleDOMPosition(rside);
    }
  }
}

// ==========================================
// 面板選色器 UI 建構函式
// ==========================================

// 預設色票（hex + opacity 組合）
const PANEL_COLORS = [
  { hex: '#ffffff', opacity: 1    },
  { hex: '#d9d8d4', opacity: 1    },
  { hex: '#4a4a4a', opacity: 1    },
  { hex: '#e8e28b', opacity: 1    },
  { hex: '#d1bec7', opacity: 1    },
  { hex: '#98b080', opacity: 1    },
  { hex: '#827664', opacity: 1    },
  { hex: '#c7e3eb', opacity: 0.5  },
  { hex: '#4a4a4a', opacity: 0.5  },
];

/**
 * buildPanelColorCell(mod, idx)
 * 回傳一個 .color-select div，內含：
 *   - 色票觸發按鈕（顯示目前色）
 *   - popup：7 色色票格 + HSL 自訂色面板
 * 供 rebuildPanelRows 插入每個面板的「顏色列」
 */
// 面板材質選項定義
const PANEL_MATERIALS = ['平面烤漆', '波音軟片', '霧面玻璃', '灰玻璃', '條砂玻璃'];
// 玻璃材質：顏色固定，不可選色
const PANEL_MATERIAL_GLASS = {
  '霧面玻璃':  { hex: '#c7e3eb', opacity: 0.5 },
  '條砂玻璃':  { hex: '#c7e3eb', opacity: 0.5 },
  '灰玻璃':    { hex: '#4a4a4a', opacity: 0.5 },
};

function buildPanelColorCell(mod, idx) {
  const panel = mod.panelHeights[idx] || {};
  const material = panel.material || '平面烤漆';
  const isGlass = !!PANEL_MATERIAL_GLASS[material];
  const currentColor = panel.color || '#ffffff';
  const uid = mod.uid;

  // ── 外層 .color-select 容器 ──
  const wrap = document.createElement('div');
  wrap.className = 'color-select';
  wrap.id = `colorSelect-${idx}-${uid}`;

  // ── 觸發按鈕（色塊小方塊）──
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'color-swatch-btn';
  btn.id = `colorBtn-${idx}-${uid}`;
  const _initOpacity = panel.opacity != null ? panel.opacity : 1;
  btn.style.background = currentColor;
  btn.style.opacity = _initOpacity;
  btn.title = isGlass ? '玻璃材質不可選色' : '點擊選色';
  if (isGlass) {
    btn.style.cursor = 'not-allowed';
    btn.disabled = true;
  } else {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleColorPopup(uid, idx);
    });
  }

  if (!isGlass) {
    // ── 彈出色盤 ──
    const popup = document.createElement('div');
    popup.className = 'color-popup';
    popup.id = `colorPopup-${idx}-${uid}`;
    popup.addEventListener('click', e => e.stopPropagation());

    // 色票格：只顯示 opacity === 1 的 7 色
    const swatchGrid = document.createElement('div');
    swatchGrid.className = 'color-swatch-grid';
    const currentOpacity = panel.opacity != null ? panel.opacity : 1;
    PANEL_COLORS.filter(c => c.opacity === 1).forEach(({ hex, opacity }) => {
      const opt = document.createElement('button');
      opt.type = 'button';
      const isSelected = currentColor.toLowerCase() === hex.toLowerCase();
      opt.className = 'color-swatch-option' + (isSelected ? ' selected' : '');
      opt.style.cssText = `background:${hex};opacity:1;`;
      opt.dataset.color = hex;
      opt.dataset.opacity = opacity;
      opt.title = hex;
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        setPanelColor(uid, idx, hex, 1);
      });
      swatchGrid.appendChild(opt);
    });
    popup.appendChild(swatchGrid);

    // HSL 自訂色面板
    appendHslPicker(popup, uid, idx, currentColor, (hex) => {
      setPanelColor(uid, idx, hex, 1);
    });

    wrap.appendChild(btn);
    wrap.appendChild(popup);
  } else {
    wrap.appendChild(btn);
  }
  return wrap;
}

function renderTable() {
  const tbody = document.getElementById('table-body');
  if (!tbody) return;
  tbody.innerHTML = '';

  if (isAggregated) {
    // 彙整模式：依「型號 + 訂製高度 + 訂製寬度 + 註記」聚合
    const map = new Map();
    modules.forEach(mod => {
      // LSIDE / RSIDE 跳過，收邊條由 BPANEL 迭代時補入
      if (mod.id === 'P3N-LSIDE' || mod.id === 'P3N-RSIDE') return;

      const hLabel = mod.heightCustomizable ? (mod.customHeight || mod.height) : null;
      const wLabel = mod.widthCustomizable ? (mod.customWidth || null) : null;
      const key = mod.id + '|' + (hLabel||'') + '|' + (wLabel||'') + '|' + (mod.note || '');
      if (map.has(key)) {
        map.get(key).qty++;
      } else {
        const _dispName = mod.id === 'P3N-POST' ? '轉柱工本費' : mod.name;
        let _dispId, _dispNote;
        if (mod.id === 'P3N-POST') {
          _dispId = getPostDisplayId(hLabel || mod.height);
          _dispNote = (_dispId === '') ? (mod.note ? mod.note + ' 訂製轉柱' : '訂製轉柱') : (mod.note || '');
        } else if (mod.id === 'P3N-BPANEL') {
          const _aggH = calcBPanelTotalH(mod);
          const _aggW = mod.customWidth || 700;
          _dispId = getBPanelDisplayId(_aggH, _aggW);
          _dispNote = mod.note || '';
        } else {
          _dispId = mod.id;
          _dispNote = mod.note || '';
        }
        map.set(key, { name: _dispName, id: _dispId, spec: mod.spec, qty: 1, note: _dispNote, hLabel, wLabel });
      }

      // BPANEL：各片面板材質各自計算
      if (mod.id === 'P3N-BPANEL') {
        getPanelMatRows(mod).forEach(row => {
          const matKey = 'MAT|' + row.id + '|' + row.spec + '|' + row.note;
          if (map.has(matKey)) {
            map.get(matKey).qty += row.qty;
          } else {
            map.set(matKey, { name: row.name, id: row.id, spec: row.spec, qty: row.qty, note: row.note, hLabel: null, wLabel: null });
          }
        });
      }

      // BPANEL：左右收邊各自計算，各 +1
      if (mod.id === 'P3N-BPANEL' && mod.gid) {
        const ls = modules.find(m => m.gid === mod.gid && m.id === 'P3N-LSIDE');
        const rs = modules.find(m => m.gid === mod.gid && m.id === 'P3N-RSIDE');
        const panelH = calcBPanelTotalH(mod);
        const sideId = getSideDisplayId(panelH);
        const sideKey = 'SIDE|' + panelH;
        const edgeCount = ((ls && ls.useEdge !== false) ? 1 : 0) + ((rs && rs.useEdge !== false) ? 1 : 0);
        if (edgeCount > 0) {
          if (map.has(sideKey)) {
            map.get(sideKey).qty += edgeCount;
          } else {
            map.set(sideKey, { name: '收邊條工本費', id: sideId, spec: `H${panelH}`, qty: edgeCount, note: sideId === '' ? '訂製收邊條' : '', hLabel: null, wLabel: null });
          }
        }
      }
    });
    map.forEach(item => {
      let specDisplay = item.spec || '';
      // spec 已含 H/W（如 BPANEL）：直接將數值標橘色，不再額外追加 tag
      if (specDisplay && /H\d+/.test(specDisplay)) {
        specDisplay = specDisplay
          .replace(/(H\d+)/g, '<span style="color:var(--accent);font-weight:600;">$1</span>')
          .replace(/(W\d+)/g, '<span style="color:var(--accent);font-weight:600;">$1</span>');
      } else {
        // 其他模塊：維持原本 hLabel / wLabel tag 邏輯
        const tags = [];
        if (item.hLabel != null) tags.push(`H${item.hLabel}`);
        if (item.wLabel != null) tags.push(`W${item.wLabel}`);
        if (tags.length) {
          const tagHtml = tags.map(t => `<span style="color:var(--accent);font-weight:600;">${t}</span>`).join(' ');
          specDisplay = specDisplay ? `${specDisplay} ${tagHtml}` : tagHtml;
        }
      }
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.name}</td>
        <td>${item.id}</td>
        <td>${specDisplay}</td>
        <td style="text-align:center;">${item.qty}</td>
        <td class="edge-cell edge-na">—</td>
        <td class="note-cell"><span style="font-size:12px;color:#555;padding:4px 6px;display:block;">${item.note}</span></td>
      `;
      tbody.appendChild(tr);
    });
  } else {
    // 明細模式：每個模塊一行；gid 群組（屏風模塊）三件合併為一行
    const renderedGids = new Set();

    modules.forEach((mod) => {
      // gid 群組：LSIDE / RSIDE 跳過，只由 BPANEL 那行代表整組
      if (mod.gid) {
        if (mod.id === 'P3N-LSIDE' || mod.id === 'P3N-RSIDE') return;
        // BPANEL：若此 gid 已渲染過則跳過（防重）
        if (renderedGids.has(mod.gid)) return;
        renderedGids.add(mod.gid);
      }

      // ── 取得同群組的 LSIDE / RSIDE（若有）──
      const lside = mod.gid ? modules.find(m => m.gid === mod.gid && m.id === 'P3N-LSIDE') : null;
      const rside = mod.gid ? modules.find(m => m.gid === mod.gid && m.id === 'P3N-RSIDE') : null;
      const isGroupRow = !!(mod.gid && lside && rside);

      const tr = document.createElement('tr');
      // 群組列：三件的 row id 都指向同一 tr（選取時高亮整行）
      tr.id = `row-${mod.uid}`;
      if (isGroupRow) {
        tr.dataset.groupRow = mod.gid;
        if (lside) document.querySelectorAll(`[id="row-${lside.uid}"]`).forEach(el => el.remove()); // 清除舊殘留
      }

      // 選取高亮（群組：任一成員被選到即高亮）
      const isSelected = mod.uid === selectedUid
        || selectedUids.has(mod.uid)
        || (isGroupRow && (selectedUids.has(lside?.uid) || selectedUids.has(rside?.uid)));
      if (isSelected) tr.classList.add('multi-selected-row');

      // ── 模塊名稱欄 ──
      const tdName = document.createElement('td');
      tdName.dataset.label = '模塊名稱';
      tdName.textContent = isGroupRow ? '屏風模塊' : (mod.id === 'P3N-POST' ? '轉柱工本費' : mod.name);
      if (isGroupRow) {
        const hasEdge = (lside && lside.useEdge !== false) || (rside && rside.useEdge !== false);
        if (hasEdge) {
          tdName.innerHTML = `<span style="display:block;">屏風模塊</span><span style="display:block;color:var(--text-secondary);font-size:11px;">收邊條工本費</span>`;
        }
      }

      // ── 型號欄 ──
      const tdId = document.createElement('td');
      tdId.dataset.label = '型號';
      if (isGroupRow) {
        const hasEdge = (lside && lside.useEdge !== false) || (rside && rside.useEdge !== false);
        const panelH = mod.id === 'P3N-BPANEL' ? calcBPanelTotalH(mod) : (mod.customHeight || mod.height);
        const panelW = mod.customWidth || 700;
        const sideId = hasEdge ? getSideDisplayId(panelH) : '';
        const isCustomSide = hasEdge && sideId === '';
        const bpanelId = mod.id === 'P3N-BPANEL' ? getBPanelDisplayId(panelH, panelW) : mod.id;

        // 同步 BPANEL note（訂製標記），確保每次 renderTable 都正確
        if (mod.id === 'P3N-BPANEL') {
          let _initNote = (mod.note || '')
            .replace(/\s*訂製收邊條/g, '')
            .replace(/\s*訂製面板高度/g, '')
            .replace(/\s*訂製面板寬度/g, '')
            .trim();
          const _cpNote = getBPanelCustomNote(panelH, panelW);
          if (_cpNote) _initNote = _initNote ? _initNote + ' ' + _cpNote : _cpNote;
          if (hasEdge && isCustomSide) _initNote = _initNote ? _initNote + ' 訂製收邊條' : '訂製收邊條';
          mod.note = _initNote;
        }

        if (hasEdge) {
          tdId.innerHTML = `<span style="display:block;">${bpanelId}</span><span style="display:block;color:var(--text-secondary);font-size:11px;">${sideId}</span>`;
        } else {
          tdId.textContent = bpanelId;
        }
        tdId.id = `tdid-group-${mod.uid}`;
      } else if (mod.id === 'P3N-POST') {
        const postH = mod.customHeight || mod.height;
        tdId.id = `tdid-${mod.uid}`;
        tdId.textContent = getPostDisplayId(postH);
      } else {
        tdId.textContent = mod.id;
      }

      // ── 規格欄：合併訂製高度輸入框 ──
      const tdSpec = document.createElement('td');
      tdSpec.dataset.label = '規格 (mm)';
      tdSpec.id = `spec-${mod.uid}`;
      if (mod.heightCustomizable) {
        // 上行顯示靜態規格文字（寬度部分），下行顯示高度輸入框
        tdSpec.style.cssText = 'vertical-align:middle; padding: 4px 8px;';
        const staticSpec = mod.spec.replace(/H\d+/, '').replace(/^\*|\*$/g,'');
        if (staticSpec) {
          tdSpec.innerHTML = `<div style="font-size:11px;color:var(--text-secondary);margin-bottom:3px;">${staticSpec}</div>`;
        }
        const heightWrap = document.createElement('div');
        heightWrap.style.cssText = 'display:flex;align-items:center;gap:4px;';
        const prefix = document.createElement('span');
        prefix.style.cssText = 'font-size:12px;color:var(--text-secondary);white-space:nowrap;';
        prefix.textContent = 'H =';
        const heightInput = document.createElement('input');
        heightInput.type = 'number';
        heightInput.min = '50';
        heightInput.max = '3000';
        heightInput.step = '1';
        heightInput.value = mod.customHeight || mod.height;
        heightInput.style.cssText = `
          width: 60px; padding: 2px 5px;
          border: 1px solid var(--border); border-radius: 5px;
          font-size: 12px; font-family: inherit;
          text-align: center; color: var(--accent);
          font-weight: 600; background: var(--accent-light);
          outline: none; transition: border-color 0.15s;
        `;
        const unit = document.createElement('span');
        unit.style.cssText = 'font-size:11px;color:var(--text-muted);';
        unit.textContent = 'mm';
        heightInput.addEventListener('focus', () => {
          heightInput.style.borderColor = 'var(--accent)';
          heightInput.style.boxShadow = '0 0 0 2px rgba(212,97,58,0.15)';
        });
        heightInput.addEventListener('blur', () => {
          heightInput.style.borderColor = 'var(--border)';
          heightInput.style.boxShadow = '';
          const val = parseInt(heightInput.value, 10);
          if (!isNaN(val) && val !== mod.customHeight) {
            refreshModuleHeight(mod, val);
            heightInput.value = mod.customHeight;
            if (mod.id === 'P3N-POST') syncPostTableRow(mod);
          }
        });
        heightInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') heightInput.blur();
        });
        heightWrap.appendChild(prefix);
        heightWrap.appendChild(heightInput);
        heightWrap.appendChild(unit);

        // 轉柱：在高度輸入框右側加入選色器
        if (mod.id === 'P3N-POST') {
          const colorSep = document.createElement('span');
          colorSep.style.cssText = 'font-size:11px;color:var(--text-muted);margin-left:4px;';
          colorSep.textContent = '顏色';
          const postColorCell = buildPostColorCell(mod);
          heightWrap.appendChild(colorSep);
          heightWrap.appendChild(postColorCell);
        }

        tdSpec.appendChild(heightWrap);
      } else if (mod.id === 'P3N-BPANEL') {
        // P3N-BPANEL：每片面板獨立高度輸入 + 增減面板按鈕
        tdSpec.style.cssText = 'vertical-align:top; padding: 4px 8px; min-width:0;';

        // 重繪所有面板輸入列的函式（＋／－ 按鈕點擊後呼叫）
        // 注入 drop 高亮動畫（只注入一次）
        if (!document.getElementById('panel-drop-style')) {
          const st = document.createElement('style');
          st.id = 'panel-drop-style';
          st.textContent = `
            @keyframes panelDropFlash {
              0%   { background: var(--accent-light); border-color: var(--accent); }
              60%  { background: var(--accent-light); border-color: var(--accent); }
              100% { background: var(--surface-2);    border-color: var(--border); }
            }
            .panel-drop-highlight {
              animation: panelDropFlash 0.7s ease-out forwards;
            }
          `;
          document.head.appendChild(st);
        }

        function rebuildPanelRows(highlightIdx = -1) {
          tdSpec.innerHTML = '';

          // ── 面板總高計算 ──
          function calcTotalH() {
            return mod.panelHeights.reduce((s, p, i) => {
              const _isLast = i === mod.panelHeights.length - 1;
              return s + p.h + (_isLast ? 41 : 15);
            }, 0);
          }

          // ── Header 列：面板總高 + W 輸入框 + 收合 toggle ──
          const specHeader = document.createElement('div');
          specHeader.style.cssText = 'display:flex;align-items:center;gap:4px;margin-bottom:5px;flex-wrap:wrap;min-width:0;';

          const totalHLabel = document.createElement('span');
          totalHLabel.className = 'panel-total-h-label';
          totalHLabel.style.cssText = 'font-size:11px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0;min-width:0;';
          totalHLabel.textContent = `面板總高 ${calcTotalH()} mm`;

          // W 輸入框（收合時也能用）
          const widthPrefix = document.createElement('span');
          widthPrefix.style.cssText = 'font-size:11px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0;';
          widthPrefix.textContent = 'W =';
          const widthInput = document.createElement('input');
          widthInput.type = 'number';
          widthInput.min = '200';
          widthInput.max = '1800';
          widthInput.step = '1';
          widthInput.value = mod.customWidth || 700;
          widthInput.style.cssText = `
            width:52px;padding:2px 4px;
            border:1px solid var(--border);border-radius:5px;
            font-size:12px;font-family:inherit;
            text-align:center;color:var(--accent);
            font-weight:600;background:var(--accent-light);
            outline:none;transition:border-color 0.15s;flex-shrink:0;min-width:0;
          `;
          const widthUnit = document.createElement('span');
          widthUnit.style.cssText = 'font-size:11px;color:var(--text-muted);flex-shrink:0;';
          widthUnit.textContent = 'mm';
          widthInput.addEventListener('focus', () => {
            widthInput.style.borderColor = 'var(--accent)';
            widthInput.style.boxShadow = '0 0 0 2px rgba(212,97,58,0.15)';
          });
          widthInput.addEventListener('blur', () => {
            widthInput.style.borderColor = 'var(--border)';
            widthInput.style.boxShadow = '';
            const val = parseInt(widthInput.value, 10);
            if (!isNaN(val) && val !== mod.customWidth) {
              refreshModuleWidth(mod, val);
            }
          });
          widthInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') widthInput.blur();
          });

          // 收合 toggle 按鈕
          const toggleBtn = document.createElement('button');
          if (mod._panelExpanded === undefined) mod._panelExpanded = false; // 預設收合
          toggleBtn.style.cssText = `
            margin-left:auto;flex-shrink:0;
            padding:1px 7px;border-radius:4px;font-size:10px;cursor:pointer;
            border:1px solid var(--border);color:var(--text-secondary);
            background:var(--surface);transition:background 0.15s,color 0.15s,border-color 0.15s;
            white-space:nowrap;font-family:inherit;line-height:1.6;
          `;
          toggleBtn.textContent = mod._panelExpanded ? '▲ 收合' : '▼ 展開';
          toggleBtn.addEventListener('mouseenter', () => {
            toggleBtn.style.borderColor = 'var(--accent)';
            toggleBtn.style.color = 'var(--accent)';
            toggleBtn.style.background = 'var(--accent-light)';
          });
          toggleBtn.addEventListener('mouseleave', () => {
            toggleBtn.style.borderColor = 'var(--border)';
            toggleBtn.style.color = 'var(--text-secondary)';
            toggleBtn.style.background = 'var(--surface)';
          });
          toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            mod._panelExpanded = !mod._panelExpanded;
            rebuildPanelRows();
          });

          // 收邊顏色 label + 選色器（收合時也能用）
          const edgeColorLabel = document.createElement('span');
          edgeColorLabel.style.cssText = 'font-size:11px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0;';
          edgeColorLabel.textContent = '收邊';
          const edgeColorCell = buildEdgeColorCell(mod);

          specHeader.appendChild(totalHLabel);
          specHeader.appendChild(widthPrefix);
          specHeader.appendChild(widthInput);
          specHeader.appendChild(widthUnit);
          specHeader.appendChild(edgeColorLabel);
          specHeader.appendChild(edgeColorCell);
          specHeader.appendChild(toggleBtn);
          tdSpec.appendChild(specHeader);

          // ── panelBody：收合/展開區域 ──
          const panelBody = document.createElement('div');
          panelBody.style.cssText = mod._panelExpanded ? 'display:block;min-width:0;overflow:visible;' : 'display:none;';

          // ── 拖曳排序狀態 ──
          let dragSrcIdx = null;

          mod.panelHeights.forEach((panel, idx) => {
            // ── 外層包裝（flex column，含高度列 + 顏色列 + 滑桿列）──
            const cardWrap = document.createElement('div');
            cardWrap.dataset.panelIdx = idx;
            cardWrap.style.cssText = `
              display:flex;flex-direction:column;gap:3px;
              margin-bottom:6px;padding:5px 6px;
              border:1px solid var(--border);border-radius:6px;
              background:var(--surface-2);
              transition:opacity 0.15s;
              min-width:0;overflow:visible;
            `;

            // dragover：顯示插入線（上／下方 border highlight）
            cardWrap.addEventListener('dragover', (e) => {
              e.preventDefault();
              e.dataTransfer.dropEffect = 'move';
              const overIdx = parseInt(cardWrap.dataset.panelIdx);
              if (dragSrcIdx === null || dragSrcIdx === overIdx) return;
              // 判斷滑鼠在卡片上半還是下半，決定插入線方向
              const rect = cardWrap.getBoundingClientRect();
              const mid  = rect.top + rect.height / 2;
              const insertBefore = e.clientY < mid;
              // 清除其他卡片的 indicator
              panelBody.querySelectorAll('[data-panel-idx]').forEach(c => {
                c.style.borderTop    = '1px solid var(--border)';
                c.style.borderBottom = '1px solid var(--border)';
              });
              if (insertBefore) {
                cardWrap.style.borderTop = '2.5px solid var(--accent)';
              } else {
                cardWrap.style.borderBottom = '2.5px solid var(--accent)';
              }
            });

            cardWrap.addEventListener('dragleave', (e) => {
              // 只在真正離開 cardWrap 時才清除（子元素觸發的 dragleave 忽略）
              if (cardWrap.contains(e.relatedTarget)) return;
              cardWrap.style.borderTop    = '1px solid var(--border)';
              cardWrap.style.borderBottom = '1px solid var(--border)';
            });

            cardWrap.addEventListener('drop', (e) => {
              e.preventDefault();
              const overIdx = parseInt(cardWrap.dataset.panelIdx);
              if (dragSrcIdx === null || dragSrcIdx === overIdx) return;

              // 判斷插入位置（上半 = 插到 overIdx 之前，下半 = 插到 overIdx 之後）
              const rect = cardWrap.getBoundingClientRect();
              const insertBefore = e.clientY < rect.top + rect.height / 2;
              let targetIdx = insertBefore ? overIdx : overIdx + 1;
              // 若來源在目標之前，刪除後 index 要修正
              if (dragSrcIdx < targetIdx) targetIdx--;

              // 重排 panelHeights
              const moved = mod.panelHeights.splice(dragSrcIdx, 1)[0];
              mod.panelHeights.splice(targetIdx, 0, moved);

              dragSrcIdx = null;
              refreshBPanelSVG(mod);
              rebuildPanelRows(targetIdx); // 傳入落點 index 供高亮使用
            });

            // ── 第一列：面板標籤 + H 輸入 + 刪除按鈕 ──
            const rowWrap = document.createElement('div');
            rowWrap.style.cssText = 'display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0;';

            // ── 拖曳手柄 ──
            const dragHandle = document.createElement('span');
            dragHandle.className = 'panel-drag-handle';
            dragHandle.title = '拖曳調整面板順序';
            dragHandle.innerHTML = '&#8942;&#8942;'; // ⋮⋮

            // 只有從 handle 才能啟動拖曳
            dragHandle.addEventListener('mousedown', () => {
              cardWrap.draggable = true;
            });
            dragHandle.addEventListener('touchstart', () => {
              cardWrap.draggable = true;
            }, { passive: true });

            cardWrap.addEventListener('dragstart', (e) => {
              dragSrcIdx = parseInt(cardWrap.dataset.panelIdx);
              e.dataTransfer.effectAllowed = 'move';
              // 拖曳中：半透明
              setTimeout(() => { cardWrap.style.opacity = '0.4'; }, 0);
            });

            cardWrap.addEventListener('dragend', () => {
              cardWrap.draggable = false;
              cardWrap.style.opacity = '1';
              dragSrcIdx = null;
              // 清除所有插入線
              panelBody.querySelectorAll('[data-panel-idx]').forEach(c => {
                c.style.borderTop    = '1px solid var(--border)';
                c.style.borderBottom = '1px solid var(--border)';
              });
            });

            const lbl = document.createElement('span');
            lbl.style.cssText = 'font-size:11px;color:var(--text-secondary);white-space:nowrap;min-width:36px;';
            lbl.textContent = `面板${idx + 1}`;

            const prefix = document.createElement('span');
            prefix.style.cssText = 'font-size:11px;color:var(--text-secondary);white-space:nowrap;';
            prefix.textContent = 'H =';

            const inp = document.createElement('input');
            inp.type = 'number';
            inp.min = '50';
            inp.max = '3000';
            inp.step = '1';
            // 最後一片扣 41mm，其他扣 15mm（panelHeights 存扣除後的值，input 顯示原始輸入值）
            const isLast = idx === mod.panelHeights.length - 1;
            const deduct = isLast ? 41 : 15;
            inp.value = panel.h + deduct;
            inp.style.cssText = `
              width:60px;min-width:0;padding:2px 5px;
              border:1px solid var(--border);border-radius:5px;
              font-size:12px;font-family:inherit;
              text-align:center;color:var(--accent);
              font-weight:600;background:var(--accent-light);
              outline:none;transition:border-color 0.15s;
              box-sizing:border-box;
            `;
            if (isLast) {
              // 建立 inline tooltip，跟著 inp 走
              const _tip = document.createElement('div');
              _tip.className = 'panel-tip';
              _tip.textContent = '底部面板尺寸輸入值需+50mm。\n例: 700mm規格尺寸→輸入750mm';
              // inp 的父容器需要 position:relative 才能讓 tooltip 定位
              inp.style.position = 'relative'; // inp 本身不行，改包一層
              // 實際做法：把 tip 放進 inp 的 parentNode，並讓 parentNode position:relative
              // 將 tip 掛在 body，用 fixed 定位避免被 overflow 截掉
              document.body.appendChild(_tip);
              const _showTip = () => {
                const rect = inp.getBoundingClientRect();
                const tipH = 70; // 預估 tip 高度
                const spaceBelow = window.innerHeight - rect.bottom;
                if (spaceBelow >= tipH + 10) {
                  // 下方空間足夠
                  _tip.style.top  = (rect.bottom + 6) + 'px';
                  _tip.style.left = rect.left + 'px';
                  _tip.classList.remove('tip-above');
                  _tip.classList.add('tip-below');
                } else {
                  // 顯示在上方
                  _tip.style.top  = (rect.top - tipH - 6) + 'px';
                  _tip.style.left = rect.left + 'px';
                  _tip.classList.remove('tip-below');
                  _tip.classList.add('tip-above');
                }
                _tip.classList.add('visible');
              };
              const _hideTip = () => _tip.classList.remove('visible');
              inp.addEventListener('mouseenter', _showTip);
              inp.addEventListener('mouseleave', _hideTip);
              inp.addEventListener('focus', _showTip);
              inp.addEventListener('blur', _hideTip);
            }
            inp.addEventListener('focus', () => {
              inp.style.borderColor = 'var(--accent)';
              inp.style.boxShadow = '0 0 0 2px rgba(212,97,58,0.15)';
            });
            inp.addEventListener('blur', () => {
              inp.style.borderColor = 'var(--border)';
              inp.style.boxShadow = '';
              const val = parseInt(inp.value, 10);
              if (!isNaN(val) && val >= 50) {
                const _isLast = idx === mod.panelHeights.length - 1;
                const oldHeightPx = mod.height * SCALE;
                mod.panelHeights[idx].h = Math.max(1, val - (_isLast ? 41 : 15));
                refreshBPanelSVG(mod);
                // 位移整組，保持底部不變
                const deltaH = mod.height * SCALE - oldHeightPx;
                if (deltaH !== 0 && mod.gid) {
                  modules.filter(m => m.gid === mod.gid).forEach(m => {
                    m.y -= deltaH;
                    updateModuleDOMPosition(m);
                  });
                } else if (deltaH !== 0) {
                  mod.y -= deltaH;
                  updateModuleDOMPosition(mod);
                }
                // 同步 matSel 玻璃選項的 disabled 狀態
                const _matSel = document.getElementById(`matSel-${idx}-${mod.uid}`);
                if (_matSel) {
                  const _rawHNew = val; // val 是使用者輸入的原始高度（mm）
                  Array.from(_matSel.options).forEach(opt => {
                    const _isGlass = !!PANEL_MATERIAL_GLASS[opt.value];
                    const _dis = _isGlass && _rawHNew > 400;
                    opt.disabled = _dis;
                    opt.textContent = _dis ? `${opt.value}（限 ≤400mm）` : opt.value;
                  });
                  // 若目前選中的是玻璃且超高，自動還原為「平面烤漆」
                  const _curMat = mod.panelHeights[idx].material || '平面烤漆';
                  if (PANEL_MATERIAL_GLASS[_curMat] && _rawHNew > 400) {
                    mod.panelHeights[idx].material = '平面烤漆';
                    mod.panelHeights[idx].opacity  = 1;
                    _matSel.value = '平面烤漆';
                    refreshBPanelSVG(mod);
                    // 重建選色器
                    const _oldCS = document.getElementById(`colorSelect-${idx}-${mod.uid}`);
                    if (_oldCS) _oldCS.replaceWith(buildPanelColorCell(mod, idx));
                  }
                }
                // 更新面板總高標示
                const newTotalH = mod.panelHeights.reduce((s, p, i) => {
                  const __isLast = i === mod.panelHeights.length - 1;
                  const __deduct = __isLast ? 41 : 15;
                  return s + p.h + __deduct;
                }, 0);
                const _header = tdSpec.querySelector('.panel-total-h-label');
                if (_header) _header.textContent = `面板總高 ${newTotalH} mm`;
                // 同步收邊條型號欄
                if (mod.gid) {
                  const _ls = modules.find(m => m.gid === mod.gid && m.id === 'P3N-LSIDE');
                  const _rs = modules.find(m => m.gid === mod.gid && m.id === 'P3N-RSIDE');
                  syncGroupRowSideId(mod, _ls, _rs, tdName, tdId, newTotalH);
                }

              } else {
                inp.value = mod.panelHeights[idx].h + deduct;
              }
            });
            inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') inp.blur(); });

            const unit = document.createElement('span');
            unit.style.cssText = 'font-size:11px;color:var(--text-muted);';
            unit.textContent = 'mm';

            const btnDel = document.createElement('button');
            btnDel.textContent = '✕';
            btnDel.title = `移除面板${idx + 1}`;
            btnDel.style.cssText = `
              width:18px;height:18px;padding:0;border-radius:3px;
              border:1px solid var(--border);background:var(--bg);
              font-size:11px;line-height:1;cursor:pointer;
              color:var(--text-secondary);margin-left:auto;
              display:${mod.panelHeights.length <= 1 ? 'none' : 'inline-flex'};
              align-items:center;justify-content:center;
            `;
            btnDel.addEventListener('click', (e) => {
              e.stopPropagation();
              if (mod.panelHeights.length <= 1) return;
              const oldHeightPx = mod.height * SCALE;
              mod.panelHeights.splice(idx, 1);
              refreshBPanelSVG(mod);
              const deltaH = mod.height * SCALE - oldHeightPx; // 負值（高度縮小）
              if (deltaH !== 0 && mod.gid) {
                modules.filter(m => m.gid === mod.gid).forEach(m => {
                  m.y -= deltaH;
                  updateModuleDOMPosition(m);
                });
              } else if (deltaH !== 0) {
                mod.y -= deltaH;
                updateModuleDOMPosition(mod);
              }
              rebuildPanelRows();
            });

            rowWrap.appendChild(dragHandle);
            rowWrap.appendChild(lbl);
            rowWrap.appendChild(prefix);
            rowWrap.appendChild(inp);
            rowWrap.appendChild(unit);
            rowWrap.appendChild(btnDel);
            cardWrap.appendChild(rowWrap);

            // ── 第二列：面板選項下拉 ──
            const matRow = document.createElement('div');
            matRow.style.cssText = 'display:flex;align-items:center;gap:5px;margin-top:3px;min-width:0;';
            const matLblEl = document.createElement('span');
            matLblEl.style.cssText = 'font-size:11px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0;';
            matLblEl.textContent = '面板選項';
            const matSel = document.createElement('select');
            matSel.id = `matSel-${idx}-${mod.uid}`;
            matSel.style.cssText = `
              font-size:11px;font-family:inherit;padding:2px 4px;
              border:1px solid var(--border);border-radius:4px;
              background:var(--surface);color:var(--text);cursor:pointer;
              outline:none;flex:1;min-width:0;
            `;
            const _rawH0 = panel.h + deduct; // 使用者輸入的原始高度（mm）
            PANEL_MATERIALS.forEach(m => {
              const opt = document.createElement('option');
              opt.value = m;
              const isGlassMat = !!PANEL_MATERIAL_GLASS[m];
              const isDisabled = isGlassMat && _rawH0 > 400;
              opt.disabled = isDisabled;
              opt.textContent = isDisabled ? `${m}（限 ≤400mm）` : m;
              if ((panel.material || '平面烤漆') === m) opt.selected = true;
              matSel.appendChild(opt);
            });
            matSel.addEventListener('change', () => {
              const newMat = matSel.value;
              mod.panelHeights[idx].material = newMat;
              const glassFixed = PANEL_MATERIAL_GLASS[newMat];
              if (glassFixed) {
                // 玻璃：固定顏色與 opacity
                mod.panelHeights[idx].color   = glassFixed.hex;
                mod.panelHeights[idx].opacity = glassFixed.opacity;
              } else {
                // 非玻璃：opacity 還原 1，波音軟片預設色
                mod.panelHeights[idx].opacity = 1;
                if (newMat === '波音軟片') mod.panelHeights[idx].color = '#E6D4C3';
              }
              refreshBPanelSVG(mod);
              // 重建此面板卡片的選色器
              const oldColorSel = document.getElementById(`colorSelect-${idx}-${mod.uid}`);
              if (oldColorSel) {
                const newColorSel = buildPanelColorCell(mod, idx);
                oldColorSel.replaceWith(newColorSel);
              }
              // 同步色塊按鈕顯示
              const _btn = document.getElementById(`colorBtn-${idx}-${mod.uid}`);
              if (_btn) {
                _btn.style.background = mod.panelHeights[idx].color;
                _btn.style.opacity    = mod.panelHeights[idx].opacity;
              }
            });
            matRow.appendChild(matLblEl);
            matRow.appendChild(matSel);
            cardWrap.appendChild(matRow);

            // ── 第三列：agora 式選色器 ──
            const colorSelectWrap = buildPanelColorCell(mod, idx);
            cardWrap.appendChild(colorSelectWrap);

            panelBody.appendChild(cardWrap);

            // 拖曳落點高亮
            if (idx === highlightIdx) {
              requestAnimationFrame(() => {
                cardWrap.classList.add('panel-drop-highlight');
                cardWrap.addEventListener('animationend', () => {
                  cardWrap.classList.remove('panel-drop-highlight');
                }, { once: true });
              });
            }
          });

          // ── ＋ 按鈕列 ──
          const ctrlWrap = document.createElement('div');
          ctrlWrap.style.cssText = 'display:flex;align-items:center;gap:6px;margin-bottom:4px;';

          const btnPlus = document.createElement('button');
          btnPlus.textContent = '＋ 增加面板';
          btnPlus.style.cssText = `
            padding:2px 8px;border-radius:4px;font-size:11px;cursor:pointer;
            border:1px solid var(--accent);color:var(--accent);
            background:var(--accent-light);transition:background 0.15s;
          `;
          btnPlus.addEventListener('click', (e) => {
            e.stopPropagation();
            mod._panelExpanded = true; // 新增面板時自動展開

            // 記錄新增前的高度（px），用於計算位移量
            const oldHeightPx = mod.height * SCALE;

            mod.panelHeights.unshift({ h: 200 - 15, color: '#ffffff', opacity: 1, material: '平面烤漆' });
            refreshBPanelSVG(mod);

            // 計算高度增量，將整組向上移動，保持底部位置不變
            const deltaH = mod.height * SCALE - oldHeightPx;
            if (deltaH !== 0 && mod.gid) {
              modules.filter(m => m.gid === mod.gid).forEach(m => {
                m.y -= deltaH;
                updateModuleDOMPosition(m);
              });
            } else if (deltaH !== 0) {
              mod.y -= deltaH;
              updateModuleDOMPosition(mod);
            }

            rebuildPanelRows();
          });

          ctrlWrap.appendChild(btnPlus);
          panelBody.insertBefore(ctrlWrap, panelBody.firstChild);
          tdSpec.appendChild(panelBody);

          // 面板高度變更後，同步 group row 型號欄的收邊條型號
          if (mod.gid) {
            const _ls = modules.find(m => m.gid === mod.gid && m.id === 'P3N-LSIDE');
            const _rs = modules.find(m => m.gid === mod.gid && m.id === 'P3N-RSIDE');
            syncGroupRowSideId(mod, _ls, _rs, tdName, tdId);
          }
        }

        rebuildPanelRows();
      } else {
        tdSpec.textContent = mod.spec;
      }

      const tdQty = document.createElement('td');
      tdQty.dataset.label = '數量';
      tdQty.style.textAlign = 'center';
      if (isGroupRow) {
        const edgeCount = ((lside && lside.useEdge !== false) ? 1 : 0) + ((rside && rside.useEdge !== false) ? 1 : 0);
        tdQty.id = `tdqty-group-${mod.uid}`;
        if (edgeCount > 0) {
          tdQty.innerHTML = `<span style="display:block;">1</span><span style="display:block;color:var(--text-secondary);font-size:11px;">${edgeCount}</span>`;
        } else {
          tdQty.textContent = '1';
        }
      } else {
        tdQty.textContent = '1';
      }

      const tdNote = document.createElement('td');
      tdNote.dataset.label = '註記';
      tdNote.className = 'note-cell';
      const textarea = document.createElement('textarea');
      textarea.rows = 1;
      textarea.id = `note-${mod.uid}`;
      // 群組列：使用 BPANEL（mod）的 note
      textarea.value = mod.note || '';
      textarea.addEventListener('input', () => {
        mod.note = textarea.value;
        // 群組列：同步 LSIDE / RSIDE 的 note（保持資料一致）
        if (isGroupRow) {
          if (lside) lside.note = textarea.value;
          if (rside) rside.note = textarea.value;
        }
      });
      tdNote.appendChild(textarea);

      // ── 側收邊欄 ──
      const tdEdge = document.createElement('td');
      tdEdge.dataset.label = '側收邊';
      if (isGroupRow && lside && rside) {
        tdEdge.className = 'edge-cell';

        // 左側收邊 checkbox
        const lLabel = document.createElement('label');
        const lChk = document.createElement('input');
        lChk.type = 'checkbox';
        lChk.checked = lside.useEdge !== false;
        lChk.addEventListener('change', () => {
          lside.useEdge = lChk.checked;
          refreshSideEdgeSVG(lside);
          syncGroupRowSideId(mod, lside, rside, tdName, tdId);
        });
        const lText = document.createTextNode('左側收邊');
        lLabel.appendChild(lChk);
        lLabel.appendChild(lText);

        // 右側收邊 checkbox
        const rLabel = document.createElement('label');
        const rChk = document.createElement('input');
        rChk.type = 'checkbox';
        rChk.checked = rside.useEdge !== false;
        rChk.addEventListener('change', () => {
          rside.useEdge = rChk.checked;
          refreshSideEdgeSVG(rside);
          syncGroupRowSideId(mod, lside, rside, tdName, tdId);
        });
        const rText = document.createTextNode('右側收邊');
        rLabel.appendChild(rChk);
        rLabel.appendChild(rText);

        tdEdge.appendChild(lLabel);
        tdEdge.appendChild(rLabel);
      } else {
        tdEdge.className = 'edge-cell edge-na';
        tdEdge.textContent = '—';
      }

      tr.addEventListener('click', (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
        if (isGroupRow) {
          // 群組列點擊：選取整組
          expandSelectionForGid(mod.gid);
        } else {
          selectModule(mod.uid);
          const modDiv = document.getElementById(`mod-${mod.uid}`);
          if (modDiv) modDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      });

      tr.appendChild(tdName);
      tr.appendChild(tdId);
      tr.appendChild(tdSpec);
      tr.appendChild(tdQty);
      tr.appendChild(tdEdge);
      tr.appendChild(tdNote);
      tbody.appendChild(tr);
    });
  }
}

function exportCSV() {
  if (modules.length === 0) {
    showToast('配置清單是空的，無法匯出');
    return;
  }

  const rows = [['模塊名稱', '型號', '規格(mm)', '數量', '備註']];

  if (isAggregated) {
    const map = new Map();
    modules.forEach(mod => {
      if (mod.id === 'P3N-LSIDE' || mod.id === 'P3N-RSIDE') return;
      const hLabel = mod.heightCustomizable ? (mod.customHeight || mod.height) : null;
      const key = mod.id + '|' + (hLabel||'') + '|' + (mod.note || '');
      if (map.has(key)) {
        map.get(key).qty++;
      } else {
        const specOut = hLabel != null ? `H${hLabel}` : mod.spec;
        const _csvName = mod.id === 'P3N-POST' ? '轉柱工本費' : mod.name;
        let _csvId;
        if (mod.id === 'P3N-POST') {
          _csvId = getPostDisplayId(hLabel || mod.height);
        } else if (mod.id === 'P3N-BPANEL') {
          const _csvH = calcBPanelTotalH(mod);
          const _csvW = mod.customWidth || 700;
          _csvId = getBPanelDisplayId(_csvH, _csvW);
        } else {
          _csvId = mod.id;
        }
        map.set(key, { name: _csvName, id: _csvId, spec: specOut, qty: 1, note: mod.note || '' });
      }

      if (mod.id === 'P3N-BPANEL') {
        getPanelMatRows(mod).forEach(row => {
          const matKey = 'MAT|' + row.id + '|' + row.spec + '|' + row.note;
          if (map.has(matKey)) {
            map.get(matKey).qty += row.qty;
          } else {
            map.set(matKey, { name: row.name, id: row.id, spec: row.spec, qty: row.qty, note: row.note });
          }
        });
      }

      if (mod.id === 'P3N-BPANEL' && mod.gid) {
        const ls = modules.find(m => m.gid === mod.gid && m.id === 'P3N-LSIDE');
        const rs = modules.find(m => m.gid === mod.gid && m.id === 'P3N-RSIDE');
        const edgeCount = ((ls && ls.useEdge !== false) ? 1 : 0) + ((rs && rs.useEdge !== false) ? 1 : 0);
        if (edgeCount > 0) {
          const panelH = mod.id === 'P3N-BPANEL' ? calcBPanelTotalH(mod) : (mod.customHeight || mod.height);
          const sideId = getSideDisplayId(panelH);
          const sideKey = 'SIDE|' + panelH;
          if (map.has(sideKey)) {
            map.get(sideKey).qty += edgeCount;
          } else {
            map.set(sideKey, { name: '收邊條工本費', id: sideId, spec: `H${panelH}`, qty: edgeCount, note: sideId === '' ? '訂製收邊條' : '' });
          }
        }
      }
    });
    map.forEach(item => rows.push([item.name, item.id, item.spec, item.qty, item.note]));
  } else {
    const exportedGids = new Set();
    modules.forEach(mod => {
      if (mod.gid) {
        if (mod.id === 'P3N-LSIDE' || mod.id === 'P3N-RSIDE') return;
        if (exportedGids.has(mod.gid)) return;
        exportedGids.add(mod.gid);
        const lside = modules.find(m => m.gid === mod.gid && m.id === 'P3N-LSIDE');
        const rside = modules.find(m => m.gid === mod.gid && m.id === 'P3N-RSIDE');
        const edgeCount = ((lside && lside.useEdge !== false) ? 1 : 0) + ((rside && rside.useEdge !== false) ? 1 : 0);
        const _csvDetailH = (mod.id === 'P3N-BPANEL') ? calcBPanelTotalH(mod) : (mod.customHeight || mod.height);
        const _csvDetailW = mod.customWidth || 700;
        const _csvDetailId = (mod.id === 'P3N-BPANEL') ? getBPanelDisplayId(_csvDetailH, _csvDetailW) : mod.id;
        rows.push(['屏風模塊', _csvDetailId, mod.spec, 1, mod.note || '']);
        // 各片面板材質
        getPanelMatRows(mod).forEach(row => {
          rows.push([row.name, row.id, row.spec, row.qty, row.note]);
        });
        if (edgeCount > 0) { const _sid = getSideDisplayId(panelH); rows.push(['收邊條工本費', _sid, `H${panelH}`, edgeCount, _sid === '' ? '訂製收邊條' : '']); }
      } else {
        const specOut = mod.heightCustomizable ? `H${mod.customHeight || mod.height}` : mod.spec;
        const _csvModName = mod.id === 'P3N-POST' ? '轉柱工本費' : mod.name;
        const _csvModId = mod.id === 'P3N-POST' ? getPostDisplayId(mod.customHeight || mod.height) : mod.id;
        rows.push([_csvModName, _csvModId, specOut, 1, mod.note || '']);
      }
    });
  }

  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
  const bom = '\uFEFF'; // UTF-8 BOM，讓 Excel 正確顯示中文
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `CP3_Screen_BOM_${Date.now()}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast('CSV 已匯出');
}
